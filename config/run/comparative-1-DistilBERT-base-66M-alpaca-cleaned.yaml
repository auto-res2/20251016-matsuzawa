run_id: comparative-1-DistilBERT-base-66M-alpaca-cleaned
method: comparative-1
model:
  name: distilbert-base-66M
  hidden_size: 768
  num_layers: 6
  adapter:
    enabled: false
  freeze_base_model: false
  classification_head:
    num_labels: 2
    dropout: 0.1
dataset:
  name: alpaca-cleaned
  max_seq_length: 512
  text_columns: ['instruction', 'input']
  label_column: output
  splits:
    train: 0.9
    val: 0.05
    test: 0.05
  batch_size: 32
training:
  learning_rate: 2e-5
  epochs: 3
  optimizer: adamw
  weight_decay: 0.01
  lr_scheduler: linear
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  mixed_precision: false
optuna:
  n_trials: 30
  direction: maximize
  timeout: 3600
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-6
      high: 1e-3
    batch_size:
      type: categorical
      choices: [16, 32, 64]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
metrics:
  - accuracy
  - f1_score
  - inference_time
device: cpu
