[project]
name = "distilbert_adapter_experiments"
version = "0.1.0"
description = "Research codebase for DistilBERT adapter experiments across vision and language tasks"
authors = [{name = "AI Researcher", email = "ai@research.org"}]
requires-python = ">=3.9"

[project.dependencies]
torch = ">=2.0.0"
torchvision = ">=0.15.0"
transformers = ">=4.34.0"
datasets = ">=2.14.0"
scikit-learn = ">=1.3.0"
hydra-core = ">=1.3.2"
wandb = ">=0.15.12"
optuna = ">=3.4.0"

[tool.setuptools.packages.find]
where = ["src"]